<meta name="apple-mobile-web-app-title" content="US Lamanon">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --vert:#d71920; --vert2:#ee1c1c; --clair:#fdecec; --ok:#1e7d4f; --okclair:#e6f4ec; --fond:#f7f5f5; --texte:#1c2321;
    --gris:#6b6b6b; --bord:#e6e1e1; --rouge:#9b1c1c; --orange:#c77700; --blanc:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);font-size:16px}
  header{background:var(--vert);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0}
  .marque{display:flex;align-items:center;gap:10px}
  .marque img{width:42px;height:42px;background:#fff;border-radius:50%;padding:3px;flex:0 0 auto}
  header button{background:#fff;color:var(--vert);border-color:#fff}
  header small{opacity:.8}
  main{max-width:860px;margin:0 auto;padding:16px}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bord);position:sticky;top:70px;z-index:4}
  nav.tabs button{white-space:nowrap}
  button{font:inherit;border:1px solid var(--bord);background:#fff;color:var(--texte);padding:8px 12px;border-radius:8px;cursor:pointer}
  button.primaire{background:var(--vert2);color:#fff;border-color:var(--vert2)}
  button.actif{background:var(--vert);color:#fff;border-color:var(--vert)}
  button.danger{color:var(--rouge);border-color:#e7b7b3}
  button.petit{padding:4px 8px;font-size:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .carte{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:16px;margin-bottom:12px}
  .carte h2,.carte h3{margin:0 0 8px}
  h2{font-size:19px} h3{font-size:16px}
  label{display:block;font-size:14px;color:var(--gris);margin:10px 0 4px}
  input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--bord);border-radius:8px;background:#fff}
  textarea{min-height:80px}
  .ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ligne>*{flex:1 1 140px}
  .muted{color:var(--gris);font-size:14px}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--okclair);color:var(--ok)}
  .badge.rouge{background:#fbe9e7;color:var(--rouge)} .badge.orange{background:#fff3df;color:var(--orange)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bord);vertical-align:top}
  th{color:var(--gris);font-weight:600}
  .scroll{overflow-x:auto}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.ok{background:var(--okclair);color:var(--ok)} .msg.err{background:#fbe9e7;color:var(--rouge)}
  .centre{max-width:420px;margin:30px auto}
  .presence button.sel-present{background:var(--ok);color:#fff}
  .presence button.sel-absent{background:var(--rouge);color:#fff}
  .presence button.sel-incertain{background:var(--orange);color:#fff}
  .lien{background:none;border:none;color:var(--vert2);text-decoration:underline;padding:0}
  .rgpd{font-size:12px;color:var(--gris);margin-top:14px;line-height:1.4}
  .sep{height:1px;background:var(--bord);margin:12px 0}
  .hidden{display:none !important}

  /* Terrain de composition */
  .terrain{position:relative;width:100%;max-width:440px;aspect-ratio:68/105;margin:12px auto;background:#2f8f3e;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 9%,transparent 9% 18%);border-radius:16px;overflow:hidden}
  .terrain .cadre{position:absolute;inset:3%;border:2px solid rgba(255,255,255,.7);border-radius:4px}
  .terrain .ligne-mediane{position:absolute;left:3%;right:3%;top:50%;border-top:2px solid rgba(255,255,255,.7)}
  .terrain .rond{position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;border:2px solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%)}
  .terrain .surface{position:absolute;left:20%;right:20%;height:13%;border:2px solid rgba(255,255,255,.7)}
  .terrain .surface.haut{top:3%;border-top:none} .terrain .surface.bas{bottom:3%;border-bottom:none}
  .terrain .but{position:absolute;left:36%;right:36%;height:5%;border:2px solid rgba(255,255,255,.7)}
  .terrain .but.haut{top:3%;border-top:none} .terrain .but.bas{bottom:3%;border-bottom:none}
  .poste{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:1}
  .poste .pastille{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--vert);border:3px solid var(--vert);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .poste.vide .pastille{background:#eef2ee;color:#9aa39c;border-color:rgba(255,255,255,.9);font-size:22px;font-weight:400}
  .poste .nom{margin-top:4px;background:rgba(15,20,18,.85);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function euros(n){ return n == null ? "" : Number(n).toLocaleString("fr-FR",{style:"currency",currency:"EUR"}); }
function dateFr(d){ if(!d) return ""; return new Date(d + (String(d).length===10?"T00:00:00":"")).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short",year:"numeric"}); }
function nomComplet(m){ return m ? `${m.prenom||""} ${m.nom||""}`.trim() || m.email : "?"; }
function libEquipe(e){ return e==="veterans"?"Vétérans":e==="feminine"?"Féminine":"—"; }
function saisonCourante(){ const d=new Date(); const y=d.getMonth()>=6?d.getFullYear():d.getFullYear()-1; return `${y}-${y+1}`; }
function message(el, texte, type="ok"){ el.innerHTML = `<div class="msg ${type}">${esc(texte)}</div>`; }
function erreurFr(e){
  const m = (e && e.message) || String(e);
  if(/Invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if(/Email not confirmed/i.test(m)) return "Ton adresse n'est pas encore confirmée : clique sur le lien reçu par e-mail.";
  if(/already registered/i.test(m)) return "Un compte existe déjà avec cette adresse.";
  if(/Password should be/i.test(m)) return "Le mot de passe doit faire au moins 6 caractères.";
  if(/rate limit/i.test(m)) return "Trop de tentatives, réessaie dans quelques minutes.";
  return m;
}
function telechargerCSV(nomFichier, lignes){
  if(!lignes.length){ alertePage("Rien à exporter."); return; }
  const cols = Object.keys(lignes[0]);
  const cell = v => { const s = v==null?"":String(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = "﻿" + [cols.join(";"), ...lignes.map(l => cols.map(c => cell(l[c])).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = nomFichier; document.body.appendChild(a); a.click(); a.remove();
}
function alertePage(t){ const d=document.createElement("div"); d.className="msg ok"; d.style.cssText="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.15)"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3000); }
async function confirmer(texte){ return window.confirm(texte); }

sb.auth.onAuthStateChange((evt, session) => {
  if(evt === "PASSWORD_RECOVERY"){ modeRecuperation = true; vueNouveauMdp(); return; }
  if(evt === "SIGNED_OUT"){ moi = null; demarrer(); }
});

async function demarrer(){
  if(modeRecuperation) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ vueConnexion(); return; }
  const { data, error } = await sb.from("membres").select("*").eq("id", session.user.id).maybeSingle();
  if(error || !data){ $app.innerHTML = `<div class="carte"><p>Ta fiche membre est introuvable. Contacte le bureau : ${esc(CONTACT_CLUB)}</p></div>`; afficherEntete(true); return; }
  moi = data;
  if(!moi.actif){ $app.innerHTML = `<div class="carte"><p>Ton compte est désactivé. Contacte le bureau : ${esc(CONTACT_CLUB)}</p></div>`; afficherEntete(true); return; }
  afficherEntete(true);
  if(!moi.prenom || !moi.nom || !moi.equipe){ ongletActif = "profil"; }
  rendreOnglets(); afficherOnglet();
}

async function vueMatchs(){
  const auj = new Date().toISOString().slice(0,10);
  let q = sb.from("matchs").select("*").order("date_match", { ascending:true });
  if(moi.role !== "bureau" && moi.equipe) q = q.eq("equipe", moi.equipe);
  const [{ data:matchs, error }, { data:presences }, { data:membres }, { data:mesVotes }] = await Promise.all([
    q, sb.from("presences").select("*"), sb.from("membres").select("id,prenom,nom,equipe,actif"), sb.from("votes").select("match_id,joueur_id").eq("votant_id", moi.id)
  ]);
  const [rc1, rc2] = await Promise.all([sb.from("convocations").select("*"), sb.from("convocation_matchs").select("*")]);
  const convsM = rc1.data || [], infosM = rc2.data || [];
  if(error){ $app.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const parId = Object.fromEntries((membres||[]).map(m => [m.id, m]));
  const aVenir = matchs.filter(m => m.date_match >= auj), passes = matchs.filter(m => m.date_match < auj).reverse();

  const carte = (m) => {
    const pres = (presences||[]).filter(p => p.match_id === m.id);
    const mienne = pres.find(p => p.membre_id === moi.id);
    const liste = s => pres.filter(p => p.statut === s).map(p => esc(nomComplet(parId[p.membre_id]))).join(", ") || "—";
    const nb = s => pres.filter(p => p.statut === s).length;
    const futur = m.date_match >= auj;
    const monVote = (mesVotes||[]).find(v => v.match_id === m.id);
    const candidats = (membres||[]).filter(x => x.actif && x.equipe === m.equipe && x.id !== moi.id)
      .sort((a,b)=>nomComplet(a).localeCompare(nomComplet(b)));
    return `<div class="carte">
      <div class="ligne" style="justify-content:space-between">
        <h3 style="flex:2">${m.domicile?"🏠":"🚌"} USL vs ${esc(m.adversaire)}</h3>
        <span class="badge" style="flex:0">${libEquipe(m.equipe)}</span>
      </div>
      <p class="muted">${dateFr(m.date_match)}${m.heure?" · "+m.heure.slice(0,5):""}${m.lieu?" · "+esc(m.lieu):""}</p>
      ${m.score_usl!=null && m.score_adv!=null ? `<p><strong>Score : USL ${m.score_usl} – ${m.score_adv} ${esc(m.adversaire)}</strong></p>`:""}
      ${m.commentaire?`<p>${esc(m.commentaire)}</p>`:""}
      ${futur ? `<div class="ligne presence">
        <button class="${mienne?.statut==="present"?"sel-present":""}" onclick="indiquerPresence('${m.id}','present')">✅ Présent</button>
        <button class="${mienne?.statut==="incertain"?"sel-incertain":""}" onclick="indiquerPresence('${m.id}','incertain')">❔ Incertain</button>
        <button class="${mienne?.statut==="absent"?"sel-absent":""}" onclick="indiquerPresence('${m.id}','absent')">❌ Absent</button>
      </div>`:""}
      <details style="margin-top:10px"><summary class="muted">✅ ${nb("present")} présents · ❔ ${nb("incertain")} · ❌ ${nb("absent")}</summary>
        <p class="muted"><strong>Présents :</strong> ${liste("present")}<br><strong>Incertains :</strong> ${liste("incertain")}<br><strong>Absents :</strong> ${liste("absent")}</p>
      </details>
      ${blocConvocation(m, convsM, infosM, parId, futur)}
      ${m.vote_ouvert ? `<div class="sep"></div><h3>🏆 Vote du meilleur joueur</h3>
        ${monVote ? `<p class="muted">Tu as voté pour ${esc(nomComplet(parId[monVote.joueur_id]))}. Merci !</p>`
          : `<div class="ligne"><select id="vote-${m.id}"><option value="">Choisir un joueur…</option>
              ${candidats.map(c=>`<option value="${c.id}">${esc(nomComplet(c))}</option>`).join("")}</select>
              <button class="primaire" style="flex:0 0 auto" onclick="voter('${m.id}')">Voter</button></div>`}`
        : `<div id="res-${m.id}"></div>`}
    </div>`;
  };

  $app.innerHTML = `<h2>Matchs à venir</h2>${aVenir.length ? aVenir.map(carte).join("") : `<p class="muted">Aucun match prévu pour l'instant.</p>`}
    <h2>Matchs passés</h2>${passes.length ? passes.map(carte).join("") : `<p class="muted">Aucun match passé.</p>`}`;
  // Résultats des votes clos
  for(const m of passes.concat(aVenir).filter(m => !m.vote_ouvert)){
    const { data } = await sb.rpc("resultats_vote", { p_match: m.id });
    const el = document.getElementById("res-"+m.id);
    if(el && data && data.length){
      const max = data[0].nb_votes;
      el.innerHTML = `<div class="sep"></div><p>🏆 <strong>Meilleur joueur :</strong> ${data.filter(d=>d.nb_votes===max).map(d=>esc(`${d.prenom} ${d.nom}`)).join(", ")} (${max} vote${max>1?"s":""})</p>`;
    }
  }
}

async function indiquerPresence(matchId, statut){
  const { error } = await sb.from("presences").upsert({ match_id:matchId, membre_id:moi.id, statut, updated_at:new Date().toISOString() });
  if(error) alertePage("Erreur : " + error.message); else vueMatchs();
}
async function voter(matchId){
  const joueur = document.getElementById("vote-"+matchId).value;
  if(!joueur){ alertePage("Choisis un joueur."); return; }
  const { error } = await sb.from("votes").insert({ match_id:matchId, votant_id:moi.id, joueur_id:joueur });
  if(error) alertePage(/duplicate/.test(error.message) ? "Tu as déjà voté pour ce match." : "Erreur : "+error.message);
  else { alertePage("Vote enregistré !"); vueMatchs(); }
}

async function vueSondages(){
  const [{ data:sondages, error }, { data:options }, { data:reps }] = await Promise.all([
    sb.from("sondages").select("*").order("created_at",{ascending:false}),
    sb.from("sondage_options").select("*").order("ordre"),
    sb.from("sondage_reponses").select("*").eq("membre_id", moi.id)
  ]);
  if(error){ $app.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!sondages.length){ $app.innerHTML = `<h2>Sondages</h2><p class="muted">Aucun sondage pour l'instant.</p>`; return; }
  const ouvert = s => s.ouvert && (!s.date_limite || new Date(s.date_limite) > new Date());

  $app.innerHTML = `<h2>Sondages</h2>` + sondages.map(s => {
    const opts = options.filter(o => o.sondage_id === s.id);
    const mes = reps.filter(r => r.sondage_id === s.id);
    const ok = ouvert(s);
    let corps;
    if(s.type === "commande"){
      corps = opts.map(o => { const r = mes.find(x => x.option_id === o.id);
        return `<div class="ligne" style="margin:6px 0"><span style="flex:2">${esc(o.libelle)} ${o.prix!=null?`<span class="muted">(${euros(o.prix)})</span>`:""}</span>
          <input type="number" min="0" placeholder="Qté" style="flex:0 0 80px" data-opt="${o.id}" data-champ="qte" value="${r?r.quantite:""}" ${ok?"":"disabled"}>
          <input placeholder="Taille" style="flex:0 0 90px" data-opt="${o.id}" data-champ="taille" value="${esc(r?.taille||"")}" ${ok?"":"disabled"}></div>`; }).join("");
      const total = mes.reduce((t,r) => { const o = opts.find(x=>x.id===r.option_id); return t + (o?.prix||0)*r.quantite; }, 0);
      if(total) corps += `<p class="muted">Total de ma commande : <strong>${euros(total)}</strong></p>`;
    } else {
      const type = s.choix_multiple ? "checkbox" : "radio";
      corps = opts.map(o => `<label style="color:var(--texte);display:flex;gap:8px;align-items:center">
        <input type="${type}" name="s-${s.id}" value="${o.id}" style="width:auto" ${mes.some(r=>r.option_id===o.id)?"checked":""} ${ok?"":"disabled"}> ${esc(o.libelle)}</label>`).join("");
    }
    return `<div class="carte" id="sond-${s.id}">
      <div class="ligne" style="justify-content:space-between"><h3 style="flex:2">${esc(s.titre)}</h3>
      <span class="badge ${ok?"":"rouge"}" style="flex:0">${ok?"Ouvert":"Clos"}</span></div>
      ${s.description?`<p>${esc(s.description)}</p>`:""}
      ${s.date_limite?`<p class="muted">Réponse avant le ${new Date(s.date_limite).toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"})}</p>`:""}
      ${corps}
      ${s.type==="commande"?`<label>Commentaire</label><input data-champ="commentaire" value="${esc(mes[0]?.commentaire||"")}" ${ok?"":"disabled"}>`:""}
      ${ok?`<p><button class="primaire" onclick="repondreSondage('${s.id}','${s.type}')">${mes.length?"Modifier ma réponse":"Envoyer ma réponse"}</button></p>`:""}
      ${mes.length?`<p class="muted">✔ Réponse enregistrée</p>`:""}
    </div>`;
  }).join("");
}

async function repondreSondage(sid, type){
  const bloc = document.getElementById("sond-"+sid);
  let lignes = [];
  if(type === "commande"){
    const com = bloc.querySelector('[data-champ="commentaire"]')?.value.trim() || null;
    bloc.querySelectorAll('[data-champ="qte"]').forEach(inp => {
      const q = parseInt(inp.value,10);
      if(q > 0){ const taille = bloc.querySelector(`[data-opt="${inp.dataset.opt}"][data-champ="taille"]`).value.trim() || null;
        lignes.push({ sondage_id:sid, option_id:inp.dataset.opt, membre_id:moi.id, quantite:q, taille, commentaire:com }); }
    });
  } else {
    bloc.querySelectorAll(`input[name="s-${sid}"]:checked`).forEach(i => lignes.push({ sondage_id:sid, option_id:i.value, membre_id:moi.id, quantite:1 }));
  }
  if(!lignes.length && !(await confirmer("Aucun choix : ta réponse précédente sera effacée. Continuer ?"))) return;
  const { error:e1 } = await sb.from("sondage_reponses").delete().eq("sondage_id", sid).eq("membre_id", moi.id);
  if(e1){ alertePage("Erreur : "+e1.message); return; }
  if(lignes.length){ const { error:e2 } = await sb.from("sondage_reponses").insert(lignes); if(e2){ alertePage("Erreur : "+e2.message); return; } }
  alertePage("Réponse enregistrée !"); vueSondages();
}

const FORMATIONS = {
  "4-4-2":[4,4,2], "4-3-3":[4,3,3], "3-5-2":[3,5,2], "4-2-3-1":[4,2,3,1], "5-3-2":[5,3,2], "3-4-3":[3,4,3],
  "3-3-1 (à 8)":[3,3,1], "2-3-2 (à 8)":[2,3,2], "3-2-2 (à 8)":[3,2,2]
};
let compoEtat = {};
let matchsConv = {};
function libellesLigne(nb, li, n, f){
  if(li === 0) return ["Gardien"];
  const att = li === n - 1, def = li === 1;
  const cotes = (g, c, d) => nb === 1 ? [c] : nb === 2 ? [c, c] : [g, ...Array(nb - 2).fill(c), d];
  if(def) return nb >= 4 ? cotes(nb === 5 ? "Piston gauche" : "Arrière gauche", "Défenseur", nb === 5 ? "Piston droit" : "Arrière droit") : Array(nb).fill("Défenseur");
  if(att) return nb === 3 ? ["Ailier gauche", "Avant-centre", "Ailier droit"] : nb === 1 ? ["Avant-centre"] : Array(nb).fill("Attaquant");
  if(f.startsWith("4-2-3-1")) return li === 2 ? ["Milieu défensif", "Milieu défensif"] : ["Ailier gauche", "Meneur", "Ailier droit"];
  return nb >= 4 ? cotes("Milieu gauche", "Milieu", "Milieu droit") : Array(nb).fill("Milieu");
}
function postesFormation(f){
  if(!FORMATIONS[f]) f = "4-4-2";
  const lignes = [1, ...FORMATIONS[f]], n = lignes.length, k = n - 1, res = [];
  lignes.forEach((nb, li) => {
    const y = li === 0 ? 90 : (k === 1 ? 45 : 74 - (li - 1) * (60 / (k - 1)));
    const lab = li === 0 ? "G" : li === 1 ? "DEF" : li === n - 1 ? "ATT" : "MIL";
    const libs = libellesLigne(nb, li, n, f);
    for(let i = 0; i < nb; i++){
      const bord = nb >= 4 && (i === 0 || i === nb - 1);
      res.push({ x: 12 + (i + 0.5) * 76 / nb, y: y - (bord ? 3 : 0), lab, lib: libs[i] });
    }
  });
  return res;
}
function padPostes(arr, n){ const a = (Array.isArray(arr) ? arr : []).slice(0, n); while(a.length < n) a.push(null); return a; }
function estTexte(v){ return typeof v === "string" && v.startsWith("txt:"); }
function nomPoste(v, parId){ if(!v) return ""; if(estTexte(v)) return v.slice(4); return nomComplet(parId[v]); }
function nomCourtPoste(v, parId){
  if(!v) return ""; if(estTexte(v)) return v.slice(4);
  const m = parId[v]; return m ? `${m.prenom || ""} ${(m.nom || "")[0] || ""}.`.trim() : "?";
}
function initialesPoste(v, parId){
  const t = estTexte(v) ? v.slice(4) : nomComplet(parId[v]);
  return t.split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
}
function htmlTerrain(mid, formation, postes, parId, convoques, editable){
  const pos = postesFormation(formation);
  return `<div class="terrain"><div class="cadre"></div><div class="ligne-mediane"></div><div class="rond"></div><div class="surface haut"></div><div class="surface bas"></div><div class="but haut"></div><div class="but bas"></div>
  ${pos.map((p, i) => {
    const v = postes[i];
    const sel = editable ? `<select onchange="choisirPoste('${mid}',${i},this.value)">
        <option value="">${v ? "Retirer ce joueur" : "Choisir un joueur…"}</option>
        ${convoques.map(c => `<option value="${c}" ${c === v ? "selected" : ""}>${esc(nomComplet(parId[c]))}${postes.includes(c) && c !== v ? " (déjà placé)" : ""}</option>`).join("")}
        ${estTexte(v) ? `<option value="${esc(v)}" selected>${esc(v.slice(4))}</option>` : ""}
        <option value="__autre__">✏️ Autre joueur (saisir le nom)…</option></select>` : "";
    return `<div class="poste ${v ? "" : "vide"}" style="left:${p.x}%;top:${p.y}%">
      <div class="pastille">${v ? esc(initialesPoste(v, parId)) : "+"}${sel}</div>
      <div class="nom ${v ? "rempli" : ""}">${v ? esc(nomCourtPoste(v, parId)) : p.lib}</div></div>`;
  }).join("")}</div>`;
}
function remplacants(e){ return e.convoques.filter(c => !e.postes.includes(c)); }
function htmlCompoEdit(mid){
  const e = compoEtat[mid];
  const remp = remplacants(e);
  return `<div class="ligne"><div><label>Formation</label><select onchange="changerFormation('${mid}',this.value)">
      ${Object.keys(FORMATIONS).map(f => `<option ${f === e.formation ? "selected" : ""}>${f}</option>`).join("")}</select></div>
      <div style="flex:0 0 auto;align-self:flex-end"><button onclick="placerAuto('${mid}')">Placer automatiquement</button></div></div>
    <p class="muted">Touchez un <strong>+</strong> pour placer un joueur, ou un joueur pour le changer.</p>
    ${htmlTerrain(mid, e.formation, e.postes, e.parId, e.convoques, true)}
    <p class="muted"><strong>Remplaçants (${remp.length}) :</strong> ${remp.map(c => esc(nomComplet(e.parId[c]))).join(", ") || "—"}</p>
    <p class="ligne"><button class="primaire" style="flex:0 0 auto" onclick="enregistrerCompo('${mid}')">Enregistrer la compo</button>
    <button style="flex:0 0 auto" onclick="viderCompo('${mid}')">Vider le terrain</button></p>`;
}
function redessinerCompo(mid){ const el = document.getElementById("compo-" + mid); if(el) el.innerHTML = htmlCompoEdit(mid); }
function choisirPoste(mid, i, val){
  const e = compoEtat[mid];
  if(val === "__autre__"){
    const nom = window.prompt("Nom du joueur à placer :", "");
    if(!nom || !nom.trim()){ redessinerCompo(mid); return; }
    val = "txt:" + nom.trim();
  }
  const prev = e.postes[i], j = val ? e.postes.indexOf(val) : -1;
  if(j >= 0 && j !== i) e.postes[j] = prev || null;
  e.postes[i] = val || null;
  redessinerCompo(mid);
}
function changerFormation(mid, f){ const e = compoEtat[mid]; e.formation = f; e.postes = padPostes(e.postes, postesFormation(f).length); redessinerCompo(mid); }
function viderCompo(mid){ const e = compoEtat[mid]; e.postes = e.postes.map(() => null); redessinerCompo(mid); }
function placerAuto(mid){
  const e = compoEtat[mid]; const libres = remplacants(e);
  e.postes = e.postes.map(v => v || libres.shift() || null); redessinerCompo(mid);
}
async function enregistrerCompo(mid){
  const e = compoEtat[mid];
  const { error } = await sb.rpc("enregistrer_compo", { p_match: mid, p_formation: e.formation, p_compo: e.postes });
  alertePage(error ? "Erreur : " + error.message : "Composition enregistrée");
}

async function vueConvocations(){

  if(moi.role === "coach") q = q.eq("equipe", moi.equipe);
  const [{ data:matchs, error }, { data:pres }, { data:membres }, r1, r2] = await Promise.all([
    q, sb.from("presences").select("*"), sb.from("membres").select("id,prenom,nom,equipe,actif"),
    sb.from("convocations").select("*"), sb.from("convocation_matchs").select("*")
  ]);
  if(error){ $app.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(r1.error || r2.error){ $app.innerHTML = `<div class="msg err">Les convocations ne sont pas encore activées : le script SQL « convocations.sql » doit être lancé dans Supabase.</div>`; return; }
  const convs = r1.data || [], infos = r2.data || [];
  const parId = Object.fromEntries((membres||[]).map(m => [m.id, m]));
  if(!matchs.length){ $app.innerHTML = `<h2>Convocations</h2><p class="muted">Aucun match à venir. Le bureau doit d'abord créer le match.</p>`; return; }
  compoEtat = {}; matchsConv = {};
  $app.innerHTML = `<h2>Convocations</h2>` + matchs.map(m => {
    matchsConv[m.id] = m;
    const pm = (pres||[]).filter(p => p.match_id === m.id);
    const convoques = convs.filter(c => c.match_id === m.id).map(c => c.membre_id);
    const info = infos.find(i => i.match_id === m.id);
    const tri = ids => ids.sort((a,b) => nomComplet(parId[a]).localeCompare(nomComplet(parId[b])));
    const presents = tri(pm.filter(p => p.statut === "present").map(p => p.membre_id));
    const incertains = tri(pm.filter(p => p.statut === "incertain").map(p => p.membre_id));
    const autres = tri(convoques.filter(c => !presents.includes(c) && !incertains.includes(c)));
    const caseJ = id => `<label style="color:var(--texte);display:flex;gap:8px;align-items:center;margin:4px 0">
      <input type="checkbox" style="width:auto" data-conv="${m.id}" value="${id}" ${convoques.includes(id) ? "checked" : ""} onchange="compterConv('${m.id}')"> ${esc(nomComplet(parId[id]))}</label>`;
    if(info){
      const n = postesFormation(info.formation || "4-4-2").length;
      compoEtat[m.id] = { formation: info.formation || "4-4-2", convoques: tri([...convoques]), parId,
        postes: padPostes(info.compo, n).map(v => (v && (estTexte(v) || convoques.includes(v))) ? v : null) };
    }
    return `<div class="carte">
      <div class="ligne" style="justify-content:space-between"><h3 style="flex:2">${m.domicile?"🏠":"🚌"} USL vs ${esc(m.adversaire)}</h3><span class="badge" style="flex:0">${libEquipe(m.equipe)}</span></div>
      <p class="muted">${dateFr(m.date_match)}${m.heure?" · "+m.heure.slice(0,5):""}${m.lieu?" · "+esc(m.lieu):""}</p>
      <details ${info ? "" : "open"}><summary><strong>1. Sélection</strong> — <span id="cnt-${m.id}">${convoques.length}</span> joueur(s) coché(s)</summary>
        <p class="muted">Présents (${presents.length})</p>${presents.map(caseJ).join("") || `<p class="muted">Personne n'a encore répondu « Présent ».</p>`}
        ${incertains.length ? `<p class="muted">Incertains (${incertains.length})</p>${incertains.map(caseJ).join("")}` : ""}
        ${autres.length ? `<p class="muted">Autres convoqués</p>${autres.map(caseJ).join("")}` : ""}
        <label>Rendez-vous (heure, lieu, covoiturage…)</label><input id="rdv-${m.id}" value="${esc(info?.rdv || m.commentaire || "")}">
        <p class="ligne"><button class="primaire" style="flex:0 0 auto" onclick="envoyerConvocation('${m.id}')">${info ? "Mettre à jour la convocation" : "Enregistrer la convocation"}</button>

      </details>
      ${info ? `<div class="sep"></div><details open><summary><strong>2. Composition</strong></summary><div id="compo-${m.id}">${htmlCompoEdit(m.id)}</div></details>
        <div class="sep"></div><p class="muted">Convocation enregistrée le ${new Date(info.envoyee_le).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}. Les joueurs la voient dans l'onglet Matchs.</p>
        <p><button class="primaire" onclick="partagerWhatsApp('${m.id}')">📲 Partager sur WhatsApp</button></p>` : ""}
    </div>`;
  }).join("");
}
function compterConv(mid){ document.getElementById("cnt-" + mid).textContent = document.querySelectorAll(`input[data-conv="${mid}"]:checked`).length; }
async function envoyerConvocation(mid){
  const ids = [...document.querySelectorAll(`input[data-conv="${mid}"]:checked`)].map(i => i.value);
  if(!ids.length){ alertePage("Coche au moins un joueur."); return; }

async function annulerConvocation(mid){
  if(!(await confirmer("Annuler la convocation et la composition de ce match ?"))) return;
  const { error } = await sb.rpc("annuler_convocation", { p_match: mid });

function partagerWhatsApp(mid){
  const m = matchsConv[mid], e = compoEtat[mid];
  const rdv = document.getElementById("rdv-" + mid)?.value.trim();
  let t = `⚽ CONVOCATION — USL vs ${m.adversaire}\n📅 ${dateFr(m.date_match)}${m.heure ? " à " + m.heure.slice(0,5) : ""}\n`;
  if(m.lieu) t += `📍 ${m.lieu}\n`;
  if(rdv) t += `⏰ RDV : ${rdv}\n`;
  if(e && e.postes.some(Boolean)){
    const pos = postesFormation(e.formation), groupes = {};
    pos.forEach((p, i) => { if(e.postes[i]) (groupes[p.lab] = groupes[p.lab] || []).push(nomPoste(e.postes[i], e.parId)); });
    t += `\n🧩 Composition (${e.formation.replace(/ \(.*\)/, "")}) :\n`;
    [["G","Gardien"],["DEF","Défense"],["MIL","Milieu"],["ATT","Attaque"]].forEach(([k,l]) => { if(groupes[k]) t += `${l} : ${groupes[k].join(", ")}\n`; });
    const remp = remplacants(e);
    if(remp.length) t += `Remplaçants : ${remp.map(c => nomComplet(e.parId[c])).join(", ")}\n`;
  } else if(e){
    t += `\nJoueurs convoqués (${e.convoques.length}) :\n${e.convoques.map(c => "- " + nomComplet(e.parId[c])).join("\n")}\n`;
  }
  t += `\nMerci de prévenir au plus vite en cas d'empêchement.`;
  window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank");
}


function blocConvocation(m, convs, infos, parId, futur){
  const info = infos.find(i => i.match_id === m.id);
  if(!info) return "";
  const ids = convs.filter(c => c.match_id === m.id).map(c => c.membre_id);
  const moiConv = ids.includes(moi.id);
  let h = `<div class="sep"></div>`;
  if(futur) h += moiConv
    ? `<div class="msg ok">📣 <strong>Tu es convoqué !</strong>${info.rdv ? `<br>⏰ RDV : ${esc(info.rdv)}` : ""}</div>`
    : `<p class="muted">Tu n'es pas convoqué pour ce match.</p>`;
  const f = FORMATIONS[info.formation] ? info.formation : null;
  if(f){
    const postes = padPostes(info.compo, postesFormation(f).length);
    if(postes.some(Boolean)){
      const remp = ids.filter(c => !postes.includes(c));
      h += `<details ${moiConv && futur ? "open" : ""}><summary><strong>🧩 Composition (${esc(f)})</strong></summary>
        ${htmlTerrain(m.id, f, postes, parId, [], false)}
        <p class="muted"><strong>Remplaçants :</strong> ${remp.map(c => esc(nomComplet(parId[c]))).join(", ") || "—"}</p></details>`;
      return h;
    }
  }
  h += `<details><summary class="muted">📣 ${ids.length} joueur(s) convoqué(s)</summary><p class="muted">${ids.map(c => esc(nomComplet(parId[c]))).sort().join(", ")}</p></details>`;
  return h;
}

    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if(f.statut === "paye" && !f.date_paiement) f.date_paiement = new Date().toISOString().slice(0,10);
    const ligne = { ...f, montant:Number(f.montant), mode:f.mode||null, date_paiement:f.date_paiement||null, commentaire:f.commentaire||null, saisi_par:moi.id };
    const { error } = await sb.from("paiements").insert(ligne);
    if(error) message(document.getElementById("paieMsg"), error.message, "err"); else { alertePage("Paiement ajouté"); bPaiements(); }
  };
}
async function pointerPaye(id){
  const mode = window.prompt("Mode de paiement ? (especes / cheque / virement / helloasso)", "especes");
  if(mode === null) return;
  const modes = ["especes","cheque","virement","helloasso"];
  const { error } = await sb.from("paiements").update({ statut:"paye", mode: modes.includes(mode.trim()) ? mode.trim() : null, date_paiement:new Date().toISOString().slice(0,10) }).eq("id", id);
  if(error) alertePage("Erreur : "+error.message); else bPaiements();
}
async function ajoutGroupe(){
  const objet = document.getElementById("grpObjet").value.trim(), montant = Number(document.getElementById("grpMontant").value);
  if(!objet || !montant){ alertePage("Renseigne l'objet et le montant."); return; }
  const { data:membres } = await sb.from("membres").select("id").eq("actif", true);
  if(!(await confirmer(`Créer « ${objet} » à ${euros(montant)} pour ${membres.length} membres ?`))) return;
  const { error } = await sb.from("paiements").insert(membres.map(m => ({ membre_id:m.id, saison:saisonCourante(), objet, montant, statut:"a_payer", saisi_par:moi.id })));
  if(error) alertePage("Erreur : "+error.message); else { alertePage("Lignes créées"); bPaiements(); }
}
async function supprimer(table, id, recharger){
  if(!(await confirmer("Supprimer définitivement ?"))) return;
  const { error } = await sb.from(table).delete().eq("id", id);
  if(error) alertePage("Erreur : "+error.message); else recharger();
}

// ---- Sondages
async function bSondages(){
  const [{ data:sondages, error }, { data:options }, { data:reps }, { data:membres }] = await Promise.all([
    sb.from("sondages").select("*").order("created_at",{ascending:false}),
    sb.from("sondage_options").select("*").order("ordre"),
    sb.from("sondage_reponses").select("*"),
    sb.from("membres").select("id,prenom,nom,email")
  ]);
  if(error){ $b().innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const parId = Object.fromEntries(membres.map(m => [m.id, m]));
  $b().innerHTML = `
  <div class="carte"><h3>Nouveau sondage</h3>
    <form id="fSond">
      <label>Titre</label><input name="titre" required placeholder="Ex. Commande de tenues 2027">
      <label>Description</label><textarea name="description"></textarea>
      <div class="ligne">
        <div><label>Type</label><select name="type"><option value="choix">Choix (vote, repas…)</option><option value="commande">Commande (quantité + taille)</option></select></div>
        <div><label>Plusieurs choix possibles ?</label><select name="choix_multiple"><option value="false">Non</option><option value="true">Oui</option></select></div>
        <div><label>Date limite</label><input name="date_limite" type="datetime-local"></div>
      </div>
      <label>Options (une par ligne ; pour une commande, ajouter le prix après « ; », ex. <em>Maillot ; 25</em>)</label>
      <textarea name="options" required placeholder="Option 1&#10;Option 2"></textarea>
      <div id="sondMsg"></div><p><button class="primaire">Créer le sondage</button></p>
    </form></div>
  ${sondages.map(s => {
    const opts = options.filter(o => o.sondage_id === s.id), rs = reps.filter(r => r.sondage_id === s.id);
    const repondants = new Set(rs.map(r => r.membre_id)).size;
    return `<div class="carte"><div class="ligne" style="justify-content:space-between"><h3 style="flex:2">${esc(s.titre)}</h3>
      <span class="badge ${s.ouvert?"":"rouge"}" style="flex:0">${s.ouvert?"Ouvert":"Clos"}</span></div>
      <p class="muted">${repondants} répondant(s)</p>
      <table><tr><th>Option</th><th>Total</th><th>Détail</th></tr>
      ${opts.map(o => { const ro = rs.filter(r => r.option_id === o.id); const tot = ro.reduce((t,r)=>t+r.quantite,0);
        return `<tr><td>${esc(o.libelle)}${o.prix!=null?` <span class="muted">${euros(o.prix)}</span>`:""}</td><td><strong>${tot}</strong></td>
          <td class="muted">${ro.map(r => esc(nomComplet(parId[r.membre_id])) + (s.type==="commande"?` ×${r.quantite}${r.taille?" ("+esc(r.taille)+")":""}`:"")).join(", ")}</td></tr>`; }).join("")}
      </table>
      <p class="ligne">
        <button style="flex:0 0 auto" onclick="basculer('sondages','${s.id}','ouvert',${!s.ouvert},bSondages)">${s.ouvert?"Clore":"Rouvrir"}</button>
        <button style="flex:0 0 auto" onclick="exportSondage('${s.id}')">Exporter (CSV)</button>
        <button style="flex:0 0 auto" class="danger" onclick="supprimer('sondages','${s.id}',bSondages)">Supprimer</button></p></div>`;
  }).join("")}`;
  document.getElementById("fSond").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const lignes = f.options.split("\n").map(l => l.trim()).filter(Boolean);
    const { data:s, error } = await sb.from("sondages").insert({
      titre:f.titre.trim(), description:f.description.trim()||null, type:f.type, choix_multiple:f.choix_multiple==="true",
      date_limite: f.date_limite ? new Date(f.date_limite).toISOString() : null, cree_par:moi.id
    }).select().single();
    if(error){ message(document.getElementById("sondMsg"), error.message, "err"); return; }
    const { error:e2 } = await sb.from("sondage_options").insert(lignes.map((l,i) => {
      const [lib, prix] = l.split(";").map(x => x.trim());
      return { sondage_id:s.id, libelle:lib, prix: prix ? Number(prix.replace(",", ".")) : null, ordre:i };
    }));
    if(e2){ message(document.getElementById("sondMsg"), e2.message, "err"); return; }
    alertePage("Sondage créé"); bSondages();
  };
}
async function basculer(table, id, champ, val, recharger){
  const { error } = await sb.from(table).update({ [champ]:val }).eq("id", id);
  if(error) alertePage("Erreur : "+error.message); else recharger();
}
async function exportSondage(sid){
  const [{ data:s }, { data:opts }, { data:rs }, { data:membres }] = await Promise.all([
    sb.from("sondages").select("*").eq("id", sid).single(), sb.from("sondage_options").select("*").eq("sondage_id", sid),
    sb.from("sondage_reponses").select("*").eq("sondage_id", sid), sb.from("membres").select("id,prenom,nom,email,telephone")
  ]);
  const parId = Object.fromEntries(membres.map(m => [m.id, m])), optId = Object.fromEntries(opts.map(o => [o.id, o]));
  telechargerCSV(`sondage_${s.titre.replace(/[^\w-]+/g,"_")}.csv`, rs.map(r => {
    const m = parId[r.membre_id] || {}, o = optId[r.option_id] || {};
    return { Nom:m.nom, Prenom:m.prenom, Email:m.email, Telephone:m.telephone, Option:o.libelle, Quantite:r.quantite, Taille:r.taille||"",
      Prix_unitaire:o.prix!=null?String(o.prix).replace(".",","):"", Total:o.prix!=null?String(o.prix*r.quantite).replace(".",","):"", Commentaire:r.commentaire||"" };
  }));
}

// ---- Matchs
async function bMatchs(){
  const { data:matchs, error } = await sb.from("matchs").select("*").order("date_match",{ascending:false});
  if(error){ $b().innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  $b().innerHTML = `
  <div class="carte"><h3>Nouveau match amical</h3>
    <form id="fMatch">
      <div class="ligne">
        <div><label>Équipe</label><select name="equipe"><option value="veterans">Vétérans</option><option value="feminine">Féminine</option></select></div>
        <div><label>Date</label><input name="date_match" type="date" required></div>
        <div><label>Heure</label><input name="heure" type="time"></div>
      </div>
      <div class="ligne">
        <div><label>Adversaire</label><input name="adversaire" required></div>
        <div><label>Lieu</label><input name="lieu" placeholder="Stade…"></div>
        <div><label>À domicile ?</label><select name="domicile"><option value="true">Oui</option><option value="false">Non</option></select></div>
      </div>
      <label>Infos (rendez-vous, covoiturage…)</label><input name="commentaire">
      <div id="matchMsg"></div><p><button class="primaire">Ajouter le match</button></p>
    </form></div>
  ${matchs.map(m => `<div class="carte">
    <div class="ligne" style="justify-content:space-between"><h3 style="flex:2">${dateFr(m.date_match)} — USL vs ${esc(m.adversaire)}</h3><span class="badge" style="flex:0">${libEquipe(m.equipe)}</span></div>
    <div class="ligne"><input type="number" min="0" placeholder="Score USL" id="su-${m.id}" value="${m.score_usl??""}"><input type="number" min="0" placeholder="Score adv." id="sa-${m.id}" value="${m.score_adv??""}">
      <button style="flex:0 0 auto" onclick="enregistrerScore('${m.id}')">Enregistrer le score</button></div>
    <p class="ligne">
      <button style="flex:0 0 auto" class="${m.vote_ouvert?"actif":""}" onclick="basculer('matchs','${m.id}','vote_ouvert',${!m.vote_ouvert},bMatchs)">${m.vote_ouvert?"Clore le vote":"Ouvrir le vote meilleur joueur"}</button>
      <button style="flex:0 0 auto" onclick="resultatsBureau('${m.id}')">Voir les votes</button>
      <button style="flex:0 0 auto" class="danger" onclick="supprimer('matchs','${m.id}',bMatchs)">Supprimer</button></p>
    <div id="rb-${m.id}"></div></div>`).join("")}`;
  document.getElementById("fMatch").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const { error } = await sb.from("matchs").insert({ ...f, heure:f.heure||null, lieu:f.lieu||null, commentaire:f.commentaire||null, domicile:f.domicile==="true" });
    if(error) message(document.getElementById("matchMsg"), error.message, "err"); else { alertePage("Match ajouté"); bMatchs(); }
  };
}
async function enregistrerScore(id){
  const su = document.getElementById("su-"+id).value, sa = document.getElementById("sa-"+id).value;
  const { error } = await sb.from("matchs").update({ score_usl: su===""?null:Number(su), score_adv: sa===""?null:Number(sa) }).eq("id", id);
  alertePage(error ? "Erreur : "+error.message : "Score enregistré");
}
async function resultatsBureau(id){
  const { data } = await sb.rpc("resultats_vote", { p_match:id });
  document.getElementById("rb-"+id).innerHTML = data && data.length
    ? `<table><tr><th>Joueur</th><th>Votes</th></tr>${data.map(d => `<tr><td>${esc(d.prenom+" "+d.nom)}</td><td>${d.nb_votes}</td></tr>`).join("")}</table>`
    : `<p class="muted">Aucun vote.</p>`;
}

// ---- Exports
function bExports(){
  $b().innerHTML = `<div class="carte"><h3>Exports pour le bureau</h3>
    <p class="muted">Fichiers CSV lisibles directement dans Excel.</p>
    <p class="ligne">
      <button style="flex:0 0 auto" onclick="exportMembres()">Liste des membres</button>
      <button style="flex:0 0 auto" onclick="exportPaiements()">État des paiements</button>
      <button style="flex:0 0 auto" onclick="exportPresences()">Présences aux matchs</button></p>
    <p class="rgpd">Ces fichiers contiennent des données personnelles : ne les diffuser qu'aux membres du bureau, et les supprimer une fois utilisés.</p></div>`;
}
async function exportMembres(){
  const { data } = await sb.from("membres").select("nom,prenom,email,telephone,equipe,role,actif,created_at").order("nom");
  telechargerCSV("membres_USL.csv", data.map(m => ({ Nom:m.nom, Prenom:m.prenom, Email:m.email, Telephone:m.telephone||"", Equipe:libEquipe(m.equipe), Role:m.role, Actif:m.actif?"oui":"non", Inscrit_le:m.created_at.slice(0,10) })));
}
async function exportPaiements(){
  const { data } = await sb.from("export_paiements").select("*");
  telechargerCSV("paiements_USL.csv", data.map(p => ({ Nom:p.nom, Prenom:p.prenom, Email:p.email, Equipe:libEquipe(p.equipe), Saison:p.saison||"", Objet:p.objet||"",
    Montant:p.montant!=null?String(p.montant).replace(".",","):"", Statut:p.statut||"", Mode:p.mode||"", Date_paiement:p.date_paiement||"", Commentaire:p.commentaire||"" })));
}
async function exportPresences(){
  const [{ data:matchs }, { data:pres }, { data:membres }] = await Promise.all([
    sb.from("matchs").select("*").order("date_match"), sb.from("presences").select("*"), sb.from("membres").select("id,prenom,nom")]);
  const mId = Object.fromEntries(matchs.map(m => [m.id, m])), pId = Object.fromEntries(membres.map(m => [m.id, m]));
  telechargerCSV("presences_USL.csv", pres.map(p => ({ Date:mId[p.match_id]?.date_match, Adversaire:mId[p.match_id]?.adversaire, Equipe:libEquipe(mId[p.match_id]?.equipe),
    Nom:pId[p.membre_id]?.nom, Prenom:pId[p.membre_id]?.prenom, Statut:p.statut })).sort((a,b)=>String(a.Date).localeCompare(String(b.Date))));
}

// =====================================================================
demarrer();
</script>
</body>
</html>
